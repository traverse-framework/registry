[workspace]

[package]
name = "report-collect-fragments-agent"
version = "0.1.0"
edition = "2021"
publish = false
description = "Real, deterministic, ABI-compliant (no_std, no serde_json/std) implementation of the report.collect-fragments capability: normalizes caller-supplied source fragments (trim, drop empty, drop case-insensitive duplicates, preserve order, clip length). See traverse-framework/registry#427 and #426."

[[bin]]
name = "collect-fragments-agent"
path = "src/main.rs"

[dependencies]
wasi-capability-runtime = { path = "../wasi-capability-runtime" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
