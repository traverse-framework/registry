[workspace]

[package]
name = "doc-approval-recommend-agent"
version = "0.1.0"
edition = "2021"
publish = false
description = "Real, deterministic, ABI-compliant (no_std) implementation of the doc-approval.recommend capability. See registry#79 and docs/decision-log.md."

[[bin]]
name = "recommend-agent"
path = "src/main.rs"

[dependencies]
wasi-capability-runtime = { path = "../wasi-capability-runtime" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
