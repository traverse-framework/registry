[workspace]

[package]
name = "core-notify-stakeholders-agent"
version = "0.1.0"
edition = "2021"
publish = false
description = "Catalog-source mirror of core.notify-stakeholders for measured llvm-cov coverage (logic from traverse examples/core-notify-stakeholders)."

[[bin]]
name = "core-notify-stakeholders-agent"
