[workspace]

[package]
name = "core-validate-audio-source-profile"
version = "1.0.0"
edition = "2021"
publish = false
description = "Portable, deterministic validation of a bounded audio-source profile."

[[bin]]
name = "core-validate-audio-source-profile"
path = "src/main.rs"

[dependencies]
wasi-capability-runtime = { path = "../wasi-capability-runtime" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
