[workspace]

[package]
name = "text-detect-language-agent"
version = "0.1.0"
edition = "2021"
publish = false
description = "Character-trigram frequency language identifier for text.detect-language. See registry#469."

[[bin]]
name = "detect-language-agent"
path = "src/main.rs"

[dependencies]
wasi-capability-runtime = { path = "../wasi-capability-runtime" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
