[workspace]

[package]
name = "core-create-audio-window-plan"
version = "1.0.0"
edition = "2021"
publish = false
description = "Portable, deterministic planning of bounded audio-analysis windows."

[[bin]]
name = "core-create-audio-window-plan"
path = "src/main.rs"

[dependencies]
wasi-capability-runtime = { path = "../wasi-capability-runtime" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
