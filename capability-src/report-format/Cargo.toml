[workspace]

[package]
name = "report-format-agent"
version = "0.1.0"
edition = "2021"
publish = false
description = "Deterministic markdown report formatter for the report.* chain. See registry#431 / #426."

[[bin]]
name = "format-agent"
path = "src/main.rs"

[dependencies]
wasi-capability-runtime = { path = "../wasi-capability-runtime" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
