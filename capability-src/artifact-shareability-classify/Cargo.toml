[workspace]

[package]
name = "artifact-shareability-classify"
version = "1.0.0"
edition = "2021"
publish = false
description = "Metadata-only shareability policy evaluation."

[[bin]]
name = "artifact-shareability-classify"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
