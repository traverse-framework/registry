[workspace]

[package]
name = "core-extract-action-items-agent"
version = "0.1.0"
edition = "2021"
publish = false
description = "Catalog-source mirror of core.extract-action-items for measured llvm-cov coverage (logic from traverse examples/core-extract-action-items)."

[[bin]]
name = "core-extract-action-items-agent"
