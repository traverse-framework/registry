[workspace]

[package]
name = "core-decide-escalation-agent"
version = "0.1.0"
edition = "2021"
publish = false
description = "Catalog-source mirror of core.decide-escalation for measured llvm-cov coverage (logic from traverse examples/core-decide-escalation)."

[[bin]]
name = "core-decide-escalation-agent"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
