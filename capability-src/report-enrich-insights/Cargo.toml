[workspace]

[package]
name = "report-enrich-insights-agent"
version = "0.1.0"
edition = "2021"
publish = false
description = "Real, deterministic, ABI-compliant (no_std) implementation of report.enrich-insights: classifies source fragments into structured Fact lines. See traverse-framework/registry#428 and #426."

[[bin]]
name = "enrich-insights-agent"
path = "src/main.rs"

[dependencies]
wasi-capability-runtime = { path = "../wasi-capability-runtime" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
