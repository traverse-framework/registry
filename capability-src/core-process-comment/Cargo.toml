[workspace]

[package]
name = "core-process-comment-agent"
version = "0.1.0"
edition = "2021"
publish = false
description = "Catalog-source mirror of core.process-comment for measured llvm-cov coverage (logic from traverse examples/core-process-comment)."

[[bin]]
name = "core-process-comment-agent"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
