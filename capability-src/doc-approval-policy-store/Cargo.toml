[workspace]

[package]
name = "doc-approval-policy-store-agent"
version = "0.1.0"
edition = "2021"
publish = false
description = "Catalog-source mirror of doc-approval.policy-store — durable approval policy via host state."

[[bin]]
name = "doc-approval-policy-store-agent"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
