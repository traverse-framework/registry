[workspace]

[package]
name = "classifier-release-gate-evaluate-agent"
version = "1.0.0"
edition = "2015"
publish = false
description = "Callweave-owned source mirror of classifier.release-gate-evaluate for independently measured registry coverage."

[[bin]]
name = "classifier-release-gate-evaluate-agent"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
