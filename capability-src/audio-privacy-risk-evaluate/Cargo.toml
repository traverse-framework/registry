[workspace]

[package]
name = "audio-privacy-risk-evaluate"
version = "1.0.0"
edition = "2021"
publish = false
description = "Configurable bounded audio evidence risk evaluation."

[[bin]]
name = "audio-privacy-risk-evaluate"
