[workspace]

[package]
name = "support-agent-session-agent"
version = "0.1.0"
edition = "2021"
publish = false
description = "Catalog-source mirror of support.agent-session — durable agent handling session via host state."

[[bin]]
name = "support-agent-session-agent"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
