[workspace]
members = [
  "crates/traverse-registry",
]
resolver = "3"

[workspace.package]
version = "0.12.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/traverse-framework/registry"
rust-version = "1.94"

[workspace.dependencies]
# The extracted crate supports the published contract surface from the current
# 0.8.1 baseline through the 0.9.x Traverse release line.
traverse-contracts = { version = ">=0.8.1, <0.10.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
