name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  spec-alignment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Write PR body to file
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > /tmp/pr_body.txt

      - name: Run spec alignment check
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci/spec_alignment_check.sh /tmp/pr_body.txt

  # Deterministic capability validation gate (specs/002-capability-validation):
  # schema, path-matching, semver format, semver-bump-vs-diff-class,
  # digest-format, namespace-path-collision (via immutability check),
  # dependency resolvability, yank-immutability (specs/005-yank-deprecation),
  # and owner/namespace/scope field shapes (specs/006-public-scope-and-identity).
  capability-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run capability validation unit tests
        run: python3 -m unittest scripts/ci/tests/test_capability_validation.py -v

      - name: Run capability validation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 scripts/ci/capability_validation.py "$BASE_SHA" "$HEAD_SHA"
          else
            python3 scripts/ci/capability_validation.py
          fi

  # Advisory (non-blocking) AI review (specs/004-ai-advisory-review).
  # Runs only on PRs that touch capabilities/, and only posts a comment --
  # never fails the run, and is intentionally not a required check.
  #
  # ANTHROPIC_API_KEY is intentionally unset as of 2026-07 (repo owner
  # deferred the budget decision -- see docs/decision-log.md item 19).
  # This job degrades cleanly to an advisory "review didn't run" comment;
  # that is expected, not a bug.
  ai-advisory-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Find changed contract.json files
        id: changed
        run: |
          git fetch origin ${{ github.event.pull_request.base.sha }} --depth=1 || true
          changed=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} -- 'capabilities/**/contract.json' | head -1)
          echo "path=$changed" >> "$GITHUB_OUTPUT"

      - name: Run AI-advisory review
        if: steps.changed.outputs.path != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/ci/ai_advisory_review.py "${{ steps.changed.outputs.path }}" /tmp/advisory_comment.md

      - name: Post advisory comment
        if: steps.changed.outputs.path != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/advisory_comment.md

  # Index/release publishing pipeline (specs/003-index-release-pipeline).
  # Only runs on merge to main, not on PRs.
  publish-index:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Determine previous index version
        id: prev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prev=$(gh release list --repo ${{ github.repository }} 2>/dev/null | grep -oE 'index-v[0-9]+' | grep -oE '[0-9]+' | sort -n | tail -1)
          echo "version=${prev:-0}" >> "$GITHUB_OUTPUT"

      - name: Run build_index unit tests
        run: python3 -m unittest scripts/ci/tests/test_build_index.py -v

      - name: Build index
        run: python3 scripts/ci/build_index.py "${{ steps.prev.outputs.version }}" "${{ github.sha }}" /tmp/index.json "${{ github.repository }}"

      - name: Publish index as GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          new_version=$(( ${{ steps.prev.outputs.version }} + 1 ))
          tag="index-v${new_version}"
          gh release create "$tag" /tmp/index.json --repo ${{ github.repository }} --title "$tag" --notes "Automated index publish for $tag" || \
          gh release upload "$tag" /tmp/index.json --repo ${{ github.repository }} --clobber

  # Discovery catalog build (registry#103/#105/#106). Regenerates
  # catalog/catalog.json from whatever is currently published, same
  # merge-to-main trigger as publish-index (spec 001 FR-006), so the
  # catalog never drifts from the actual capabilities/ tree.
  build-catalog:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.0"
          targets: wasm32-unknown-unknown
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            capability-src/catalog-builder
            capability-src/validate-luhn
            capability-src/validate-email
            capability-src/normalize-phone-number
            capability-src/score-password-strength
            capability-src/format-currency
            capability-src/traverse-starter-process
            capability-src/traverse-starter-validate
            capability-src/traverse-starter-summarize
            capability-src/doc-approval-analyze
            capability-src/doc-approval-recommend
            capability-src/meeting-notes-process

      - name: Install wasmtime
        run: |
          curl https://wasmtime.dev/install.sh -sSf | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Build catalog-builder
        run: cargo build --release --target wasm32-unknown-unknown --manifest-path capability-src/catalog-builder/Cargo.toml

      - name: Gather capability metadata
        # Also measures real test_coverage per capability (cargo llvm-cov)
        # for each id's current version -- see gather_catalog_data.py.
        run: python3 scripts/ci/gather_catalog_data.py /tmp/gathered.json

      - name: Run catalog-builder
        run: wasmtime run capability-src/catalog-builder/target/wasm32-unknown-unknown/release/catalog-builder.wasm < /tmp/gathered.json > catalog/catalog.json

      - name: Generate static capability pages + sitemap.xml (registry#131)
        run: python3 scripts/ci/generate_catalog_pages.py catalog/catalog.json https://registry.traverse-framework.com catalog

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: catalog

  # Deploys the artifact build-catalog just produced. Split into its own
  # job (rather than one job doing both) because actions/deploy-pages
  # requires the `pages: write`/`id-token: write` permissions and the
  # `github-pages` environment, which should be scoped as narrowly as
  # possible -- not granted to the build steps that also run
  # capability_validation.py-adjacent tooling.
  #
  # continue-on-error is intentional and matches ai-advisory-review's
  # precedent elsewhere in this file: this action fails until the repo
  # owner enables GitHub Pages (Settings -> Pages -> Build and deployment
  # source: "GitHub Actions"), a repo-settings change this agent
  # deliberately does not make itself (registry#106's own scope note; same
  # precedent as decision-log entries 28/29). That is an expected,
  # not-yet-configured state, not a build regression -- it should not show
  # as a hard, alarming failure on every merge to main until the owner
  # flips that toggle.
  deploy-catalog:
    needs: build-catalog
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
