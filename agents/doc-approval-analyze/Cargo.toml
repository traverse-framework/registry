[workspace]

[package]
name = "doc-approval-analyze-agent"
version = "0.1.0"
edition = "2021"
publish = false
description = "Real, deterministic (no model/network/randomness) implementation of the doc-approval.analyze capability. See registry#79 and docs/decision-log.md."

[[bin]]
name = "analyze-agent"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
