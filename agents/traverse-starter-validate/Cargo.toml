[workspace]

[package]
name = "traverse-starter-validate-agent"
version = "0.1.0"
edition = "2021"
publish = false
description = "Real, deterministic, ABI-compliant (no_std) implementation of the traverse-starter.validate capability. See registry#79 and docs/decision-log.md."

[[bin]]
name = "validate-agent"
path = "src/main.rs"

[dependencies]
wasi-agent-runtime = { path = "../wasi-agent-runtime" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
